 if(!authed){$('#app').innerHTML=`<div class="lgn"><div class="lb"><div class="bl"><span class="lg" style="width:40px;height:40px;border-radius:12px;font-size:20px">${esc(cfg.name.charAt(0))}</span>${esc(cfg.name)}</div><div><h1>Sua adega, vendendo no automático.</h1><ul><li>Pedidos chegando em tempo real no painel</li><li>Cupons, promoções e taxa de entrega por bairro</li><li>Relatórios de vendas e produtos mais vendidos</li></ul></div><small>Adegaflow · Gestão para depósitos de bebidas</small></div>
  <div class="lf"><form class="lc" id="lf"><h2 style="font-size:30px">Entrar no painel</h2><p style="color:var(--mu);margin:6px 0 10px">Use seu usuário e senha de acesso.</p><label>Usuário</label><input class="f" id="em" autocomplete="username" autocapitalize="none" required><label>Senha</label><input class="f" type="password" id="pw" autocomplete="current-password" required><div class="err" id="le"></div><button class="btn pri" style="width:100%;padding:12px" id="lb">Entrar</button><p style="text-align:center;margin-top:18px"><a href="#" style="color:var(--mu)">Voltar para a loja</a></p></form></div></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#lb').disabled=true;const u=$('#em').value.trim().toLowerCase(),{error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+'@adegaflow.app',password:$('#pw').value});$('#lb').disabled=false;if(error)$('#le').textContent='Usuário ou senha incorretos.';else{authed=true;await load();admin()}};return}
 const cur=TABS.find(t=>t[0]===tab);
 $('#app').innerHTML=`<div class="app"><aside class="sb"><div class="bl"><span class="lg" style="width:34px;height:34px;border-radius:10px;font-size:17px">${esc(cfg.name.charAt(0))}</span>${esc(cfg.name)}</div>${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${ico(t[0])}<span>${t[1]}</span></button>`).join('')}<div class="sbf"><a href="#">Ver loja</a><button id="pwb">Alterar senha</button><button id="lo">Sair</button></div></aside>
 <div class="mn"><div class="tp"><h2>${cur[1]}</h2><div style="display:flex;gap:8px;align-items:center"><button class="sw ${cfg.open?'on':''}" id="sw" role="switch" aria-checked="${cfg.open}"><i></i>${cfg.open?'Loja aberta':'Loja fechada'}</button><button class="btn sm mm" id="am">Conta</button></div></div><section id="tb"></section></div></div>`;
 $('#sw').onclick=toggleOpen;$('#am').onclick=acctModal;$('#pwb').onclick=pwModal;
 $('#lo').onclick=async()=>{await sb.auth.signOut();authed=false;admin()};
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;admin()});
 ({dash:aDash,ord:aOrd,prod:aProd,cup:aCup,zn:aZones,cfg:aCfg})[tab]();
}
async function aDash(){
 $('#tb').innerHTML='<p style="color:var(--mu)">Carregando…</p>';
 const r=await sb.from('orders').select('*').gte('created_at',new Date(Date.now()-30*864e5).toISOString());
 if(r.error)return $('#tb').innerHTML='<p class="err">Erro: '+esc(r.error.message)+'. Execute o supabase-upgrade.sql.</p>';
 const os=r.data.filter(o=>o.status!=='cancelado'),d0=new Date();d0.setHours(0,0,0,0);
 const sum=a=>a.reduce((t,o)=>t+ +o.total,0),td=os.filter(o=>new Date(o.created_at)>=d0),novos=r.data.filter(o=>o.status==='novo').length;
 const days=[...Array(7)].map((_,i)=>{const d=new Date(d0);d.setDate(d.getDate()-6+i);const e=new Date(d);e.setDate(e.getDate()+1);return{l:d.toLocaleDateString('pt-BR',{weekday:'short'}),v:sum(os.filter(o=>{const t=new Date(o.created_at);return t>=d&&t<e}))}}),mx=Math.max(1,...days.map(d=>d.v));
 const tp={};os.forEach(o=>o.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.qty));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $('#tb').innerHTML=`<div class="kp"><div class="k"><b>${R(sum(td))}</b><span>Faturamento hoje</span></div><div class="k"><b>${td.length}</b><span>Pedidos hoje</span></div><div class="k"><b>${R(os.length?sum(os)/os.length:0)}</b><span>Ticket médio (30 dias)</span></div><div class="k"><b>${R(sum(os))}</b><span>Faturamento (30 dias)</span></div><div class="k"><b>${novos}</b><span>Pedidos novos</span></div></div>
 <h3 style="margin:20px 0 10px">Últimos 7 dias</h3><div class="bars">${days.map(d=>`<div><span>${d.v?Math.round(d.v):''}</span><i style="height:${d.v/mx*100}%"></i>${d.l}</div>`).join('')}</div>
 <h3 style="margin:24px 0 10px">Produtos mais vendidos (30 dias)</h3><div class="tw"><table class="tbl"><tbody>${top.map(t=>`<tr><td>${esc(t[0])}</td><td>${t[1]} un.</td></tr>`).join('')||'<tr><td>Ainda sem vendas.</td></tr>'}</tbody></table></div>`;
}
async function aOrd(){
 $('#tb').innerHTML='<p style="color:var(--mu)">Carregando…</p>';
 const r=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
 if(r.error)return $('#tb').innerHTML='<p class="err">Erro: '+esc(r.error.message)+'</p>';
 const all=r.data,l=all.filter(o=>!ofl||o.status===ofl),lab=o=>o.status==='saiu'&&o.mode==='Retirada'?'Pronto para retirada':ST[o.status],nx={novo:['preparo','Aceitar pedido'],preparo:['saiu','Saiu / pronto'],saiu:['entregue','Marcar entregue']},cn=k=>all.filter(o=>o.status===k).length;
 $('#tb').innerHTML=`<div class="fl"><button class="chip ${!ofl?'on':''}" data-f="">Todos (${all.length})</button>${Object.entries(ST).map(([k,v])=>`<button class="chip ${ofl===k?'on':''}" data-f="${k}">${v} (${cn(k)})</button>`).join('')}</div>
 <div class="og">${l.map(o=>{const code=o.id.slice(0,6).toUpperCase();return `<div class="oc"><div class="oh"><div><b>#${code}</b><small>${new Date(o.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small></div><span class="bg ${o.status}">${lab(o)}</span></div>
 <div><b>${esc(o.customer_name)}</b><br><small style="color:var(--mu)">${esc(o.customer_phone)}</small><br><small>${o.mode}${o.zone_name?' · '+esc(o.zone_name):''}${o.address?' · '+esc(o.address):''}</small></div>
 <ul class="oi">${o.items.map(i=>`<li><span>${i.qty}x ${esc(i.name)}</span><span>${R(i.qty*i.price)}</span></li>`).join('')}</ul>
 <div class="ot"><span>${esc(o.payment)}${o.change_for?' · troco p/ '+esc(o.change_for):''}${o.coupon?' · cupom '+esc(o.coupon):''}</span><b>${R(o.total)}</b></div>${o.notes?`<small style="color:var(--mu)">Obs.: ${esc(o.notes)}</small>`:''}
 <div class="oa">${nx[o.status]?`<button class="btn sm pri" data-s="${o.id}" data-v="${nx[o.status][0]}">${nx[o.status][1]}</button>`:''}<a class="btn sm" target="_blank" rel="noopener" href="${wa(o.customer_phone,'Olá, '+o.customer_name+'! Seu pedido #'+code+' está: '+lab(o)+'.')}">Avisar no WhatsApp</a>${o.status!=='cancelado'&&o.status!=='entregue'?`<button class="btn sm dg" data-s="${o.id}" data-v="cancelado">Cancelar</button>`:''}</div></div>`}).join('')||'<div class="empty">Nenhum pedido por aqui.</div>'}</div>`;
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ofl=b.dataset.f;aOrd()});
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{if(b.dataset.v==='cancelado'&&!confirm('Cancelar este pedido?'))return;if(await run(sb.from('orders').update({status:b.dataset.v}).eq('id',b.dataset.s),'Status atualizado'))aOrd()});
}
function aProd(){
 $('#tb').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px"><input class="f" id="ps" type="search" placeholder="Buscar produto"><button class="btn pri" id="np">Novo produto</button></div><div class="tw"><table class="tbl"><thead><tr><th></th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th><th></th></tr></thead><tbody id="pb"></tbody></table></div>`;
 const draw=()=>{const t=$('#ps').value.toLowerCase();$('#pb').innerHTML=prods.filter(p=>p.name.toLowerCase().includes(t)).map(p=>`<tr><td><img src="${pimg(p)}" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover"></td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${unit(p)<p.price?`<s style="color:var(--mu)">${R(p.price)}</s> ${R(p.promo)}`:R(p.price)}</td><td>${p.stock}</td><td><button class="btn sm" data-tg="${p.id}">${p.on?'Ativo':'Pausado'}</button></td><td style="white-space:nowrap"><button class="btn sm" data-ed="${p.id}">Editar</button> <button class="btn sm dg" data-dl="${p.id}">Excluir</button></td></tr>`).join('');
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>form(b.dataset.ed));
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const p=prods.find(x=>x.id===b.dataset.tg);if(await run(sb.from('products').update({active:!p.on}).eq('id',p.id))){p.on=!p.on;draw()}});
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{const p=prods.find(x=>x.id===b.dataset.dl);if(confirm('Excluir "'+p.name+'"?')&&await run(sb.from('products').delete().eq('id',p.id),'Produto excluído')){prods=prods.filter(x=>x!==p);delete cart[p.id];sv('adega_cart',cart);draw()}})};
 $('#ps').oninput=draw;$('#np').onclick=()=>form();draw();
}
function form(id){
 const p=prods.find(x=>x.id===id)||{name:'',cat:'',price:'',promo:0,stock:0,img:'',desc:'',on:true};imgTmp={url:p.img||'',blob:null};
 const m=$('#mo');m.classList.add('on');
 m.innerHTML=`<form class="box" id="pf"><h2 style="font-size:24px">${id?'Editar produto':'Novo produto'}</h2><label>Nome</label><input class="f" name="name" required value="${esc(p.name)}">
 <div class="two"><div><label>Categoria</label><input class="f" name="cat" required list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(prods.map(x=>x.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div><label>Estoque</label><input class="f" name="stock" type="number" min="0" required value="${p.stock}"></div>
 <div><label>Preço (R$)</label><input class="f" name="price" type="number" step="0.01" min="0" required value="${p.price}"></div><div><label>Preço promocional (opcional)</label><input class="f" name="promo" type="number" step="0.01" min="0" value="${p.promo||''}"></div></div>
 <label>Imagem do produto</label><div style="display:flex;gap:12px;align-items:center"><img id="pv" alt="" src="${pimg(p)}" style="width:96px;height:72px;border-radius:10px;object-fit:cover"><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn sm" style="margin:0;color:var(--tx)">Enviar imagem<input type="file" id="fi" accept="image/*" hidden></label><button type="button" class="btn sm" id="ri">Remover</button></div></div>
 <label>Descrição</label><textarea class="f" name="desc" rows="2">${esc(p.desc)}</textarea><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" name="on" ${p.on?'checked':''}> Mostrar na loja</label>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button type="button" class="btn" id="cc2">Cancelar</button><button class="btn pri" id="sbtn">Salvar produto</button></div></form>`;
 $('#cc2').onclick=closeMo;
 $('#fi').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,b=>{imgTmp={url:'',blob:b};$('#pv').src=URL.createObjectURL(b)})};
 $('#ri').onclick=()=>{imgTmp={url:'',blob:null};$('#pv').src=pack($('#pf').name.value,$('#pf').cat.value)};
 $('#pf').onsubmit=async e=>{e.preventDefault();const f=e.target;$('#sbtn').disabled=true;let url=imgTmp.url;
  if(imgTmp.blob){const path=crypto.randomUUID()+'.jpg',u=await sb.storage.from('products').upload(path,imgTmp.blob,{contentType:'image/jpeg'});if(u.error){toast('Erro no envio da imagem: '+u.error.message);$('#sbtn').disabled=false;return}url=sb.storage.from('products').getPublicUrl(path).data.publicUrl}
  const pr=parseFloat(f.price.value),pm=parseFloat(f.promo.value),row={name:f.name.value.trim(),category:f.cat.value.trim(),price:pr,promo_price:pm>0&&pm<pr?pm:null,stock:parseInt(f.stock.value,10),description:f.desc.value.trim(),image_url:url||null,active:f.on.checked};
  const r=id?await sb.from('products').update(row).eq('id',id).select().single():await sb.from('products').insert(row).select().single();
  if(r.error){toast('Erro: '+r.error.message);$('#sbtn').disabled=false;return}
  const d={id:r.data.id,name:row.name,cat:row.category,price:pr,promo:row.promo_price||0,stock:row.stock,desc:row.description,img:url,on:row.active};
  if(id)Object.assign(p,d);else prods.push(d);closeMo();admin();toast('Produto salvo')};
}
function closeMo(){const m=$('#mo');m.classList.remove('on');m.innerHTML=''}
async function aCup(){
 const r=await sb.from('coupons').select('*').order('created_at',{ascending:false});if(r.error)return $('#tb').innerHTML='<p class="err">Erro: '+esc(r.error.message)+'. Execute o supabase-upgrade.sql.</p>';
 $('#tb').innerHTML=`<p style="color:var(--mu)">Crie cupons de desconto percentual ou em reais, com pedido mínimo opcional.</p><form id="cf2" class="fg"><div><label>Código</label><input class="f" name="c" required></div><div><label>Tipo</label><select class="f" name="k"><option value="percent">Percentual (%)</option><option value="fixed">Valor fixo (R$)</option></select></div><div><label>Valor</label><input class="f" name="v" type="number" step="0.01" min="0.01" required></div><div><label>Pedido mínimo (R$)</label><input class="f" name="m" type="number" step="0.01" min="0" value="0"></div><button class="btn pri">Criar cupom</button></form>
 <div class="tw"><table class="tbl"><thead><tr><th>Código</th><th>Desconto</th><th>Mínimo</th><th>Status</th><th></th></tr></thead><tbody>${r.data.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${c.kind==='percent'?c.value+'%':R(c.value)}</td><td>${R(c.min_order)}</td><td><button class="btn sm" data-ct="${c.id}" data-a="${c.active}">${c.active?'Ativo':'Pausado'}</button></td><td><button class="btn sm dg" data-cd="${c.id}">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhum cupom criado.</td></tr>'}</tbody></table></div>`;
 $('#cf2').onsubmit=async e=>{e.preventDefault();const f=e.target;if(await run(sb.from('coupons').insert({code:f.c.value.trim().toUpperCase(),kind:f.k.value,value:+f.v.value,min_order:+f.m.value||0}),'Cupom criado'))aCup()};
 document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=async()=>{if(await run(sb.from('coupons').update({active:b.dataset.a!=='true'}).eq('id',b.dataset.ct)))aCup()});
 document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir este cupom?')&&await run(sb.from('coupons').delete().eq('id',b.dataset.cd),'Cupom excluído'))aCup()});
}
function aZones(){
 $('#tb').innerHTML=`<p style="color:var(--mu);max-width:56ch">Cadastre os bairros atendidos e a taxa de cada um. Bairros ocultos não aparecem no carrinho.</p>
 <form id="zf" style="display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end;max-width:620px"><div><label>Novo bairro</label><input class="f" name="n" required></div><div><label>Taxa (R$)</label><input class="f" name="f" type="number" step="0.01" min="0" required></div><button class="btn pri">Adicionar</button></form>
 <div class="tw" style="margin-top:18px"><table class="tbl"><thead><tr><th>Bairro</th><th>Taxa (R$)</th><th>Status</th><th></th></tr></thead><tbody>${cfg.zones.map(z=>`<tr><td><input class="f" data-zn="${z.id}" value="${esc(z.name)}"></td><td><input class="f" data-zf="${z.id}" type="number" step="0.01" min="0" value="${z.fee}"></td><td><button class="btn sm" data-zt="${z.id}">${z.on?'Ativo':'Oculto'}</button></td><td style="white-space:nowrap"><button class="btn sm" data-zs="${z.id}">Salvar</button> <button class="btn sm dg" data-zd="${z.id}">Excluir</button></td></tr>`).join('')||'<tr><td colspan="4">Nenhum bairro cadastrado. Sem bairros, não há entrega.</td></tr>'}</tbody></table></div>`;
 const zz=id=>cfg.zones.find(x=>x.id===id);
 $('#zf').onsubmit=async e=>{e.preventDefault();const f=e.target,row={name:f.n.value.trim(),fee:+f.f.value||0,active:true};const r=await sb.from('zones').insert(row).select().single();if(r.error)return toast('Erro: '+r.error.message);cfg.zones.push({id:r.data.id,name:row.name,fee:row.fee,on:true});toast('Bairro adicionado');admin()};
 document.querySelectorAll('[data-zs]').forEach(b=>b.onclick=async()=>{const z=zz(b.dataset.zs),n=document.querySelector(`[data-zn="${z.id}"]`).value.trim(),fee=+document.querySelector(`[data-zf="${z.id}"]`).value||0;if(!n)return toast('Informe o nome do bairro');if(await run(sb.from('zones').update({name:n,fee}).eq('id',z.id),'Bairro salvo')){z.name=n;z.fee=fee}});
 document.querySelectorAll('[data-zt]').forEach(b=>b.onclick=async()=>{const z=zz(b.dataset.zt);if(await run(sb.from('zones').update({active:!z.on}).eq('id',z.id))){z.on=!z.on;aZones()}});
 document.querySelectorAll('[data-zd]').forEach(b=>b.onclick=async()=>{const z=zz(b.dataset.zd);if(confirm('Excluir o bairro "'+z.name+'"?')&&await run(sb.from('zones').delete().eq('id',z.id),'Bairro excluído')){cfg.zones=cfg.zones.filter(x=>x!==z);admin()}});
}

function aCfg(){
 $('#tb').innerHTML=`<form id="cf" style="max-width:600px"><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" name="open" ${cfg.open?'checked':''}> Loja aberta para pedidos (desmarque para fechar fora do horário)</label>
 <label>Nome da loja</label><input class="f" name="name" value="${esc(cfg.name)}" required><label>Frase de destaque</label><input class="f" name="tag" value="${esc(cfg.tagline)}">
 <label>WhatsApp que recebe os pedidos (com DDI e DDD)</label><input class="f" name="phone" value="${esc(cfg.phone)}" required inputmode="numeric"><label>Chave Pix (opcional)</label><input class="f" name="pix" value="${esc(cfg.pix)}">
 <div class="two"><div><label>Pedido mínimo — entrega (R$)</label><input class="f" name="minD" type="number" step="0.01" min="0" value="${cfg.minD}"></div><div><label>Pedido mínimo — retirada (R$)</label><input class="f" name="minP" type="number" step="0.01" min="0" value="${cfg.minP}"></div></div>
 <label>Entrega grátis a partir de (R$, 0 desativa)</label><input class="f" name="free" type="number" step="0.01" min="0" value="${cfg.free}"><label>Região atendida</label><input class="f" name="city" value="${esc(cfg.city)}">
 <label>Formas de pagamento (separe por vírgula)</label><input class="f" name="pays" value="${esc(cfg.pays.join(', '))}">
 <h3 style="margin:22px 0 4px">Horário de funcionamento</h3>${DAYS.map((d,i)=>{const h=hrs(i);return `<div style="display:grid;grid-template-columns:110px 1fr 1fr;gap:8px;align-items:center;margin-top:8px"><label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" name="d${i}" ${h?'checked':''}> ${d}</label><input class="f" type="time" name="a${i}" value="${h?h[0]:'10:00'}"><input class="f" type="time" name="c${i}" value="${h?h[1]:'23:00'}"></div>`}).join('')}
 <div style="margin-top:20px"><button class="btn pri">Salvar configurações</button></div></form>`;
 $('#cf').onsubmit=async e=>{e.preventDefault();const f=e.target,hours={};DAYS.forEach((_,i)=>{hours[i]=f['d'+i].checked?[f['a'+i].value,f['c'+i].value]:null});
  const n={name:f.name.value.trim(),tagline:f.tag.value.trim(),phone:f.phone.value.trim(),pix:f.pix.value.trim(),open:f.open.checked,minD:+f.minD.value||0,minP:+f.minP.value||0,free:+f.free.value||0,city:f.city.value.trim(),hours,pays:f.pays.value.split(',').map(x=>x.trim()).filter(Boolean)};
  if(!n.pays.length)n.pays=['Pix'];
  if(await run(sb.from('settings').upsert({id:1,name:n.name,tagline:n.tagline,phone:n.phone,pix_key:n.pix,is_open:n.open,min_delivery:n.minD,min_pickup:n.minP,free_from:n.free,city:n.city,hours:n.hours,pays:n.pays}),'Configurações salvas')){Object.assign(cfg,n);admin()}};
}
boot();
</script></body></html>
