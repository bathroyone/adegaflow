<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adega Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1310;--sf:#121d18;--sf2:#1a2922;--tx:#f4f1e8;--mu:#93a69a;--ac:#e8b04a;--ac-t:#1b1206;--ln:#243830;--ok:#63d391;--er:#ff8c78;--hd:'Bricolage Grotesque','Trebuchet MS',sans-serif;--bd:'Figtree','Segoe UI',sans-serif}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f2ea;--sf:#fff;--sf2:#ebe8dc;--tx:#12271f;--mu:#5b6c62;--ac:#b57d0c;--ac-t:#fff;--ln:#dad6c5;--ok:#1f7a45;--er:#b3341f}}
:root[data-theme="dark"]{--bg:#0b1310;--sf:#121d18;--sf2:#1a2922;--tx:#f4f1e8;--mu:#93a69a;--ac:#e8b04a;--ac-t:#1b1206;--ln:#243830}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--bd)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3{font-family:var(--hd);margin:0;line-height:1.15}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.btn{border:1px solid var(--ln);background:transparent;padding:9px 16px;border-radius:999px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pri{background:var(--ac);color:var(--ac-t);border-color:var(--ac)}.btn.sm{padding:6px 12px;font-size:14px}.btn.dg{color:var(--er)}.btn:disabled{opacity:.5}
.hero{background:radial-gradient(120% 140% at 85% -10%,#2a5a45 0,transparent 55%),radial-gradient(90% 120% at 0 110%,#5a3d0e 0,transparent 55%),var(--sf);border-bottom:1px solid var(--ln);padding:44px 0 28px}
.hc{display:flex;gap:20px;align-items:center}
.lg{width:84px;height:84px;border-radius:24px;background:var(--ac);color:var(--ac-t);display:grid;place-items:center;font:700 40px var(--hd);flex:none}
.hero h1{font-size:clamp(30px,6vw,46px);letter-spacing:-.02em}.hero p{margin:4px 0 12px;color:var(--mu)}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--mu)}
.pill.on{color:var(--ok);border-color:var(--ok)}.pill.off{color:var(--er);border-color:var(--er)}
.cn{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.cn .wrap{display:flex;gap:8px;align-items:center;padding-top:10px;padding-bottom:10px}
.cn input{flex:0 0 190px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:8px 14px;min-width:0}
.cs{display:flex;gap:6px;overflow-x:auto;flex:1}
.chip{white-space:nowrap;background:transparent;border:1px solid var(--ln);border-radius:999px;padding:6px 14px;color:var(--mu)}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sec{padding-top:28px}.sec h2{font-size:24px;margin-bottom:12px}
.pl{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pc{display:flex;justify-content:space-between;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px}
.pt{display:flex;flex-direction:column;gap:4px;min-width:0}.pt h3{font-size:17px}
.pt p{margin:0;color:var(--mu);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
